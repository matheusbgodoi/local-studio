appId: org.local.studio.desktop
productName: CRIAs AI
asar: true

afterPack: ./desktop/project.mjs

asarUnpack:
  - "node_modules/@lydell/**/*.node"
  - "node_modules/@lydell/**/spawn-helper"

files:
  - desktop/dist/**
  - package.json
  - node_modules/@lydell/node-pty/**
  - node_modules/@lydell/node-pty-${platform}-${arch}/**
  - "!node_modules/next/**"
  - "!node_modules/@next/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/typescript/**"
  - "!node_modules/@img/**"
  - "!node_modules/sharp/**"
  - "!node_modules/playwright-core/**"
  - "!node_modules/@playwright/**"
  - "!node_modules/@earendil-works/**"
  - "!node_modules/**/@earendil-works/**"
  - "!node_modules/undici/**"
  - "!node_modules/**/undici/**"
  - "!node_modules/brace-expansion/**"
  - "!node_modules/**/brace-expansion/**"

extraResources:
  - from: desktop/speech
    to: speech
    filter:
      - LocalStudioDictation
      - LocalStudioTitle
      - LocalStudioDictationHotkey
  - from: desktop/resources/app-update.yml
    to: app-update.yml
  - from: ../services/agent-runtime/dist/standalone.mjs
    to: app/agent-runtime/standalone.mjs
  - from: ../services/agent-runtime/dist/node_modules
    to: app/agent-runtime/node_modules
  - from: .next/standalone
    to: app/frontend/.next/standalone
    filter:
      - "**/*"
      - "!data/**"
      - "!frontend/data/**"
      - "!**/dist-desktop/**"
      - "!**/*.log"
  - from: .next/static
    to: app/frontend/.next/standalone/.next/static
    filter:
      - "**/*"
  - from: .next/static
    to: app/frontend/.next/standalone/frontend/.next/static
    filter:
      - "**/*"
  - from: public
    to: app/frontend/.next/standalone/public
    filter:
      - "**/*"
  - from: public
    to: app/frontend/.next/standalone/frontend/public
    filter:
      - "**/*"
  - from: ../scripts/install-controller.sh
    to: app/scripts/install-controller.sh
  - from: desktop/resources/pi-extensions
    to: desktop/resources/pi-extensions
    filter:
      - "**/*"
  - from: desktop/resources/mcp
    to: desktop/resources/mcp
    filter:
      - "**/*"
  - from: desktop/resources/plugins
    to: desktop/resources/plugins
    filter:
      - "**/*"
  - from: desktop/resources/skills
    to: desktop/resources/skills
    filter:
      - "**/*"

directories:
  output: dist-desktop
  buildResources: desktop/resources

mac:
  icon: desktop/resources/icon.icns
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/resources/entitlements.mac.plist
  entitlementsInherit: desktop/resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Record your own voice to create a private, local voice profile.
    NSSpeechRecognitionUsageDescription: Transcribe your speech into the composer. Everything stays on this Mac — no audio ever leaves the machine.

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - AppImage
