appId: org.local.studio.desktop
productName: Local Studio
asar: true

afterPack: ./desktop/project.mjs

asarUnpack:
  - "node_modules/@lydell/**/*.node"
  - "node_modules/@lydell/**/spawn-helper"

files:
  - desktop/dist/**
  - package.json
  - node_modules/@lydell/node-pty/**
  - node_modules/@lydell/node-pty-${platform}-${arch}/**
  # electron-builder auto-includes EVERY production dependency, but the Electron
  # main process only requires electron, electron-updater, effect and node-pty
  # (verified: those are the only non-relative requires in desktop/dist). The web
  # app is NOT loaded from the asar — app-server.ts forks
  # .next/standalone/server.js, which ships separately under extraResources with
  # its own output-traced node_modules. Dropping the framework and its build-time
  # toolchain from the asar takes it from 494 MB to 336 MB.
  #
  # NB: a stricter "!node_modules/** + re-add the transitive closure" inversion
  # gets the asar to 40 MB but the packaged app then hangs before its first log
  # line, so it is deliberately not used.
  - "!node_modules/next/**"
  - "!node_modules/@next/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/typescript/**"
  - "!node_modules/@img/**"
  - "!node_modules/sharp/**"
  - "!node_modules/playwright-core/**"
  - "!node_modules/@playwright/**"

extraResources:
  # The on-device dictation helper. A standalone Swift executable rather than a native Node
  # addon: this repository has no node-gyp, no node-addon-api and no electron-rebuild, and a
  # helper spawned over stdio needs none of them and does not have to be rebuilt when Electron
  # moves. Built by desktop/speech/build.sh; see the header of LocalStudioDictation.swift.
  #
  # It has to be OPTIONAL: it only exists after that script has run, and only on macOS. A build
  # without it must still succeed and produce an app whose dictation button is simply absent —
  # the correct degradation, and not a button that fails when pressed.
  #
  # Expressed as a directory plus a filter, not as `optional: true`. `optional` is not a key
  # electron-builder knows: it does not warn about it, it just fails the whole FileSet against
  # the schema and reports `extraResources.0 should be a string`, which points at the entry
  # rather than at the invented key. A `from` directory that always exists with a filter that
  # may match nothing gives the tolerance that key was reaching for, using the schema as it is.
  - from: desktop/speech
    to: speech
    filter:
      - LocalStudioDictation
  - from: desktop/resources/app-update.yml
    to: app-update.yml
  - from: ../services/agent-runtime/dist/standalone.mjs
    to: app/agent-runtime/standalone.mjs
  # Everything bundle-agent-runtime decided to keep outside standalone.mjs, in
  # one copy: the portable browser runtime, node-pty (native addon, dynamically
  # required by pty-service) and the Pi packages.
  #
  # The Pi packages MUST stay real directories here. pi's extension loader
  # builds its jiti alias table from the loader module's own import.meta.url
  # (typebox, @earendil-works/pi-agent-core, pi-tui, pi-ai, pi-coding-agent).
  # Bundled into standalone.mjs that URL is Resources/app/agent-runtime/, which
  # resolves none of them, getAliases() throws and EVERY extension fails to
  # load — ours and any the user installs.
  - from: ../services/agent-runtime/dist/node_modules
    to: app/agent-runtime/node_modules
  - from: .next/standalone
    to: app/frontend/.next/standalone
    filter:
      - "**/*"
      - "!data/**"
      - "!frontend/data/**"
      - "!**/dist-desktop/**"
      - "!**/*.log"
  - from: .next/static
    to: app/frontend/.next/standalone/.next/static
    filter:
      - "**/*"
  - from: .next/static
    to: app/frontend/.next/standalone/frontend/.next/static
    filter:
      - "**/*"
  - from: public
    to: app/frontend/.next/standalone/public
    filter:
      - "**/*"
  - from: public
    to: app/frontend/.next/standalone/frontend/public
    filter:
      - "**/*"
  - from: ../scripts/install-controller.sh
    to: app/scripts/install-controller.sh
  - from: desktop/resources/pi-extensions
    to: desktop/resources/pi-extensions
    filter:
      - "**/*"
  - from: desktop/resources/mcp
    to: desktop/resources/mcp
    filter:
      - "**/*"
  - from: desktop/resources/plugins
    to: desktop/resources/plugins
    filter:
      - "**/*"
  - from: desktop/resources/skills
    to: desktop/resources/skills
    filter:
      - "**/*"

directories:
  output: dist-desktop
  buildResources: desktop/resources

mac:
  icon: desktop/resources/icon.icns
  category: public.app-category.developer-tools
  # NO IDENTITY. This fork inherited upstream's Developer ID name here and kept it, which was
  # wrong twice over.
  #
  # It broke the build: with that certificate absent from this keychain, electron-builder
  # SKIPS signing entirely rather than falling back, so the bundle carried only the ad-hoc
  # signature Electron's own binary ships with — `Identifier=Electron`, `Info.plist=not bound`
  # — and `codesign --verify` failed with "code has no resources but signature indicates they
  # must be present". scripts/install-desktop-app.sh refuses such a bundle, correctly, so the
  # repo could build an app it would not install.
  #
  # And it was an identity claim this project is not entitled to make. RELEASING.md: the fork
  # "is not upstream and must never present itself as one". Had that certificate ever been
  # present, every build would have shipped signed as upstream's developer.
  #
  # NO IDENTITY, and the signing happens at INSTALL time instead. Three values were tried here
  # and only the third is workable:
  #
  #   "sherif cherfa (TZ447KHNZL)"  upstream's Developer ID, inherited and never changed. Absent
  #                                 from this keychain, so electron-builder SKIPS signing rather
  #                                 than falling back, leaving the bundle wearing only the
  #                                 linker-signed ad-hoc signature Electron's own binary ships
  #                                 with (Identifier=Electron, Info.plist not bound). The
  #                                 installer refuses that, correctly — so the repo could build
  #                                 an app it would not install.
  #   "-"                           codesign's ad-hoc identity. It DOES sign correctly, and the
  #                                 result verifies. But electron-builder then runs its own
  #                                 `codesign --verify --deep --strict` over the result, and
  #                                 that check CANNOT pass for any Electron bundle — it objects
  #                                 to the ordinary Versions/Current symlinks inside
  #                                 Electron Framework.framework. See the long note in
  #                                 scripts/install-desktop-app.sh, which measured all four
  #                                 verify variants. So the build fails after producing a
  #                                 perfectly good app.
  #   null                          electron-builder skips signing AND skips that impossible
  #                                 verification. The bundle is unsigned, honestly, and
  #                                 install-desktop-app.sh ad-hoc signs it as it stages it.
  #
  # Signing at install time is not a workaround, it is where the fact lives: this Mac has no
  # Developer ID, so ad-hoc is the only signature available, and the installer is the step that
  # knows whether it is handling an owner build or a notarised release (which it must never
  # re-sign — that would strip the notarisation).
  #
  # Naming upstream's certificate was also an identity claim this project is not entitled to
  # make. RELEASING.md: the fork "is not upstream and must never present itself as one". Had
  # that certificate ever been present, every build would have shipped signed as its developer.
  # Someone with their OWN Developer ID sets CSC_NAME or CSC_LINK in the environment.
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/resources/entitlements.mac.plist
  entitlementsInherit: desktop/resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Record your own voice to create a private, local voice profile.
    # WITHOUT THIS KEY A NATIVE SPEECH PATH HARD-CRASHES ON FIRST AUTHORIZATION. macOS kills the
    # process outright rather than returning a denial, so the symptom is the app vanishing, not
    # a permission prompt. It was absent while the dictation helper was being written, which is
    # precisely the order in which that bug reaches a user.
    NSSpeechRecognitionUsageDescription: Transcribe your speech into the composer. Everything stays on this Mac — no audio ever leaves the machine.

dmg:
  # Nothing to sign it WITH, now that no identity is named. `true` here asked electron-builder
  # to sign the disk image with a certificate the build has already established it does not
  # have.
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - AppImage
